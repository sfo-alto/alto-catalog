<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALTO Quick Links</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap');

  :root{
    --ink:#1F2A24;
    --sand:#E6DCC3;
    --turquoise:#2F6E6A;
    --turquoise-dark:#204E4B;
    --marigold:#C97A2B;
    --plum:#4A3049;
    --plum-dark:#372338;
    --cream:#F6EFDD;
    --card-bg:#FBF8F0;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--sand);
    color:var(--ink);
    font-family:'Work Sans',system-ui,sans-serif;
    min-height:100vh;
  }

  .marquee{
    background:linear-gradient(180deg,var(--plum) 0%,var(--plum-dark) 100%);
    color:var(--cream);
    padding:2.6rem 1.5rem 2.4rem;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .marquee::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:repeating-linear-gradient(90deg, rgba(246,239,221,0.06) 0 2px, transparent 2px 28px);
    pointer-events:none;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:0.7rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--marigold);
    margin-bottom:0.9rem;
    position:relative;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(2rem,7vw,2.9rem);
    margin:0 0 0.5rem;
    position:relative;
  }
  .sub{
    font-size:0.95rem;
    color:rgba(246,239,221,0.75);
    margin:0;
    position:relative;
  }

  main{
    max-width:760px;
    margin:0 auto;
    padding:2.2rem 1.25rem 3rem;
  }

  .group-block{margin-bottom:1.8rem;}
  .group-block:last-child{margin-bottom:0;}
  .group-label{
    font-family:'JetBrains Mono',monospace;
    font-size:0.66rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--marigold);
    margin:0 0 0.7rem;
    padding-left:0.1rem;
  }

  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:1rem;
  }
  @media(min-width:600px){
    .grid{grid-template-columns:1fr 1fr;}
  }

  .card{
    display:flex;
    gap:0.9rem;
    align-items:flex-start;
    background:var(--card-bg);
    border-radius:14px;
    padding:1.1rem 1.2rem;
    text-decoration:none;
    color:var(--ink);
    position:relative;
    box-shadow:0 1px 0 rgba(31,42,36,0.05);
    border:1px solid rgba(31,42,36,0.08);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(31,42,36,0.12);
  }
  .card:focus-visible{
    outline:2px solid var(--turquoise-dark);
    outline-offset:3px;
  }
  .card::before,.card::after{
    content:"";
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:16px;
    height:16px;
    background:var(--sand);
    border-radius:50%;
  }
  .card::before{ left:-8px; }
  .card::after{ right:-8px; }

  .icon{
    flex:0 0 auto;
    width:42px;
    height:42px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--turquoise);
    color:var(--cream);
  }
  .icon svg{width:20px;height:20px;}

  .card-body{flex:1 1 auto; min-width:0;}
  .card-title{
    font-weight:600;
    font-size:0.98rem;
    margin:0 0 0.2rem;
    display:flex;
    align-items:center;
    gap:0.4rem;
  }
  .card-desc{
    font-size:0.83rem;
    color:rgba(31,42,36,0.62);
    margin:0;
    line-height:1.35;
  }

  footer{
    text-align:center;
    padding:1.5rem 1rem 2.5rem;
    font-size:0.75rem;
    color:rgba(31,42,36,0.5);
  }

  @media (prefers-reduced-motion: reduce){
    .card{transition:none;}
  }
</style>
</head>
<body>

<div class="marquee">
  <div class="eyebrow">Santa Fe Opera · ALTO</div>
  <h1>Quick Links</h1>
  <p class="sub">Everything you need for the 2026–27 residency season, one tap away.</p>
</div>

<main>
  <div id="content"></div>
</main>

<footer>
  Edit the LINKS list in this file to add, remove, or re-sort links — no rebuild needed.
</footer>

<script>
const ICONS = {
  form: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
  folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>',
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>'
};

const GROUP_META = {
  reference: { title:'Reference — Shared with Teachers' },
  live:      { title:'Live & Public' },
  planning:  { title:'Planning Tools' }
};

const LINKS = [
  { group:'reference', title:'ALTO Splash Page', desc:'Program overview on the SFO site — handy if a teacher asks.', icon:'globe', url:'https://www.santafeopera.org/alto/' },
  { group:'reference', title:'Public ALTO Catalog', desc:'Live residency + TA catalog site.', icon:'globe', url:'https://sfo-alto.github.io/alto-catalog/' },
  { group:'reference', title:'Teacher Information Sheet', desc:'What teachers receive before your residency starts.', icon:'doc', url:'https://www.santafeopera.org/alto-teacher-information-page/' },
  { group:'reference', title:'Residency Request Form', desc:'How teachers request a residency — for reference.', icon:'form', url:'https://airtable.com/appvIZeFTshTXHIBt/pagepreN8MnXKo65C/form' },

  { group:'live', title:'Residency Calendar View', desc:'Live scheduling view, all districts.', icon:'calendar', url:'https://tinyurl.com/ALTOLive26' },

  { group:'planning', title:'District Calendars 2026–27', desc:'School calendars for every partner district.', icon:'folder', url:'https://drive.google.com/drive/folders/1i8s7YZ5eTYc9IH0WPh82QlthMVSpyGxr?usp=sharing' },
  { group:'planning', title:'Residency Planning Handout', desc:'Aug 2022 planning guide — still the reference doc.', icon:'doc', url:'https://drive.google.com/file/d/1EWdGSq8KV_FJwmvlI-AeFVWOA5S8hyCi/view?usp=sharing' },
  { group:'planning', title:'NM State Content Standards', desc:'Official state-adopted content standards.', icon:'globe', url:'https://web.ped.nm.gov/bureaus/instructional-materials/new-mexico-adopted-content-standards/' },
  { group:'planning', title:'Workflow Folder', desc:'Process docs and workflow resources.', icon:'folder', url:'https://tinyurl.com/ALTOworkflow2026' },
];

const content = document.getElementById('content');

function cardHTML(l){
  return `<a href="${l.url}" target="_blank" rel="noopener noreferrer" class="card">
      <div class="icon">${ICONS[l.icon] || ICONS.doc}</div>
      <div class="card-body">
        <p class="card-title">${l.title}</p>
        <p class="card-desc">${l.desc}</p>
      </div>
    </a>`;
}

function render(){
  content.innerHTML = '';
  ['reference','live','planning'].forEach(g => {
    const groupItems = LINKS.filter(i => i.group === g);
    if(!groupItems.length) return;
    const wrap = document.createElement('div');
    wrap.className = 'group-block';
    wrap.innerHTML = `<p class="group-label">${GROUP_META[g].title}</p><div class="grid">${groupItems.map(cardHTML).join('')}</div>`;
    content.appendChild(wrap);
  });
}

render();
</script>

</body>
</html>
